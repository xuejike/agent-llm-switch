<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    LLM 配置管理器 应用图标
    设计理念：中央「配置枢纽」（芯片/中枢）向四周多个「AI Agent 节点」分发连线，
    体现「一处维护配置真相 · 一键分发到多个本地 AI Agent」的核心功能。
    配色：蓝紫渐变（科技 / AI），圆角方形底（现代桌面应用风格）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hub" x1="362" y1="362" x2="662" y2="662" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- 分发连线：从中枢到四个角落的 agent 节点 -->
  <g stroke="#C7D2FE" stroke-width="18" stroke-linecap="round" opacity="0.85">
    <line x1="512" y1="512" x2="252" y2="252"/>
    <line x1="512" y1="512" x2="772" y2="252"/>
    <line x1="512" y1="512" x2="252" y2="772"/>
    <line x1="512" y1="512" x2="772" y2="772"/>
  </g>

  <!-- 四个 Agent 节点（外围圆点） -->
  <g fill="#C7D2FE">
    <circle cx="252" cy="252" r="58"/>
    <circle cx="772" cy="252" r="58"/>
    <circle cx="252" cy="772" r="58"/>
    <circle cx="772" cy="772" r="58"/>
  </g>
  <!-- 节点内部高光，增强「终端/设备」观感 -->
  <g fill="#EEF2FF">
    <circle cx="252" cy="252" r="26"/>
    <circle cx="772" cy="252" r="26"/>
    <circle cx="252" cy="772" r="26"/>
    <circle cx="772" cy="772" r="26"/>
  </g>

  <!-- 中央配置枢纽：圆角方形「芯片」+ 引脚，象征集中配置真相 -->
  <g filter="url(#softShadow)">
    <!-- 芯片引脚 -->
    <g fill="#A5B4FC">
      <rect x="452" y="330" width="26" height="54" rx="8"/>
      <rect x="546" y="330" width="26" height="54" rx="8"/>
      <rect x="452" y="640" width="26" height="54" rx="8"/>
      <rect x="546" y="640" width="26" height="54" rx="8"/>
      <rect x="330" y="452" width="54" height="26" rx="8"/>
      <rect x="330" y="546" width="54" height="26" rx="8"/>
      <rect x="640" y="452" width="54" height="26" rx="8"/>
      <rect x="640" y="546" width="54" height="26" rx="8"/>
    </g>
    <!-- 芯片主体 -->
    <rect x="372" y="372" width="280" height="280" rx="56" fill="url(#hub)"/>
    <!-- 中央「切换/分发」符号：双向箭头环，寓意在多个配置/agent 间切换分发 -->
    <g stroke="#4F46E5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 上弧 + 右箭头 -->
      <path d="M452 476 a60 60 0 0 1 120 0"/>
      <path d="M572 476 l0 -40 M572 476 l34 -20"/>
      <!-- 下弧 + 左箭头 -->
      <path d="M572 548 a60 60 0 0 1 -120 0"/>
      <path d="M452 548 l0 40 M452 548 l-34 20"/>
    </g>
  </g>
</svg>
